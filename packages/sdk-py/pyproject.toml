[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenlens-sdk"
version = "0.1.0"
description = "FinOps for LLMs — cost attribution per customer/feature/team for OpenAI & Anthropic."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["llm", "finops", "cost", "openai", "anthropic", "token", "attribution", "observability"]
authors = [{ name = "TokenLens" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/USER/tokenlens"
Repository = "https://github.com/USER/tokenlens"
Issues = "https://github.com/USER/tokenlens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenlens"]

[tool.hatch.build.targets.sdist]
include = ["src/tokenlens", "README.md", "LICENSE"]
